# 서버 바인딩 — Render 는 PORT 환경변수를 주입한다(기본 10000). 로컬은 8080 로 폴백.
# 0.0.0.0 바인딩이어야 컨테이너 외부에서 접근 가능하다.
server:
  port: ${PORT:8080}
  address: 0.0.0.0

# CORS 허용 오리진 — 프론트 도메인이 나중에 정해지므로 하드코딩하지 않는다(CorsConfig 가 사용).
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

spring:
  application:
    name: divurve-api

  # 전역 SNAKE_CASE 직렬화 — DTO 는 camelCase 로 작성하고 직렬화 시 자동 변환 (문서 5장)
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/divurve}
    username: ${DB_USERNAME:divurve}
    password: ${DB_PASSWORD:divurve}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway 가 관리한다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # DB 마이그레이션 (문서 2장 — Flyway 제안)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# API 문서 (문서 6장)
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs
