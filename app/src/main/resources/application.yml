# ── 공통 설정 (모든 환경 공유) ─────────────────────────────────────────────
# 환경별로 다른 부분(DB 접속·프론트 오리진)만 application-dev / application-prod 로 분리한다.
# 활성 프로파일: 기본 dev, Render 는 SPRING_PROFILES_ACTIVE=prod 를 주입해 prod 로 뜬다.

# 서버 바인딩 — Render 는 PORT 환경변수를 주입한다(기본 10000). 로컬은 8080 로 폴백.
# 0.0.0.0 바인딩이어야 컨테이너 외부에서 접근 가능하다.
server:
  port: ${PORT:8080}
  address: 0.0.0.0

# 인증 (이슈 #9) — JWT 액세스/리프레시 토큰. Spring Security 미사용.
# jwt-secret 은 운영에서 반드시 JWT_SECRET 환경변수로 주입한다(HS256, 32바이트 이상).
# 로컬 폴백은 개발 전용 값이므로 그대로 배포하지 않는다.
# access 30분(1800s)·refresh 14일(1209600s) — NFR-SE-02.

app:
  auth:
    jwt-secret: ${JWT_SECRET:local-dev-insecure-jwt-secret-please-override-in-prod-0123456789}
    access-token-ttl-seconds: 1800
    refresh-token-ttl-seconds: 1209600
  # 외부 데이터 인프라 (이슈 #12) — ECOS(환율)·FRED(거시지표)
  # API 키는 운영에서 반드시 환경변수(ECOS_API_KEY / FRED_API_KEY)로 주입한다. 로컬 폴백 없음.
  # NFR-DT-02: 환율=ECOS, 거시지표=FRED 를 1차 출처로 한다.
  external:
    ecos:
      base-url: https://ecos.bok.or.kr/api
      api-key: ${ECOS_API_KEY:}
      stat-code: 731Y001   # 원/미달러 등 주요통화 대원화환율(일)
      item-codes:
        USD_KRW: "0000001"
        JPY_KRW: "0000002"   # 100엔당
        EUR_KRW: "0000003"
        CNY_KRW: "0000053"
    fred:
      base-url: https://api.stlouisfed.org/fred
      api-key: ${FRED_API_KEY:}
    # AI 서술(narrate) 경로 — Anthropic Claude (이슈 #73).
    # enabled=false(기본)면 ClaudeAiProvider 빈이 만들어지지 않고 MockAiProvider 의 템플릿 문장이 나간다.
    # true 로 켤 때 api-key 가 비어 있으면 기동 시점에 실패한다 — 켰다고 믿는 채로 템플릿이 나가는 것보다 낫다.
    # request-timeout(5s)·AiService 총예산(8s)·SDK 재시도 0 은 이슈 #73 확정값이다.
    # 계산에는 관여하지 않는다(CLAUDE.md §1) — 검증된 facts 를 문장으로 옮기는 데만 쓴다.
    anthropic:
      enabled: ${ANTHROPIC_ENABLED:false}
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-opus-5
      max-tokens: 1024
      request-timeout: 5s
      total-budget: 8s

spring:
  application:
    name: divurve-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 전역 SNAKE_CASE 직렬화 — DTO 는 camelCase 로 작성하고 직렬화 시 자동 변환 (문서 5장)
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  # DB 드라이버는 공통, 접속 정보(url/username/password)는 프로파일별로 지정
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      # 연결이 안 열릴 때 무한 대기(hang) 대신 명확한 예외로 빠르게 실패시킨다.
      connection-timeout: 10000
      initialization-fail-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway 가 관리한다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # DB 마이그레이션 (문서 2장 — Flyway 제안)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


# API 문서 (문서 6장)
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs
