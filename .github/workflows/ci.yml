name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # build + test 에 4장 ArchUnit(Layer/Module) 테스트와 8장 JaCoCo 100% 게이트가 모두 포함된다.
      # 아키텍처 위반·커버리지 미달 시 이 스텝에서 빌드가 실패한다.
      - name: Build, test, coverage & architecture verification
        run: ./gradlew build test jacocoTestCoverageVerification
